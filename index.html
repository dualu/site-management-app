<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dualufix - Electrical Maintenance & Work Order App</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- jsPDF for Report Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .fade-in { animation: fadeIn 0.25s ease-in-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 h-full flex flex-col justify-between items-center selection:bg-amber-500 selection:text-white">

    <div class="w-full h-full max-w-md bg-slate-950 flex flex-col shadow-2xl overflow-hidden relative border-x border-slate-800">

        <!-- Top Header Navigation Bar -->
        <header class="bg-slate-900 border-b border-slate-800 px-4 py-3 flex items-center justify-between z-10 shrink-0">
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 rounded-lg bg-amber-500 flex items-center justify-center text-slate-950 font-bold shadow-md shadow-amber-500/20">
                    <i class="fa-solid fa-bolt text-sm"></i>
                </div>
                <div>
                    <h1 class="font-bold text-sm tracking-tight text-slate-100 leading-none">Dualufix Portal</h1>
                    <span id="headerRoleBadge" class="text-[10px] uppercase font-semibold tracking-wider text-amber-400 bg-amber-400/10 px-1.5 py-0.5 rounded">Not Logged In</span>
                </div>
            </div>
            
            <div id="headerActions" class="flex items-center space-x-2">
                <button onclick="openSmsSimulatorModal()" class="relative p-2 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-300 transition text-xs" title="View SMS Outbox">
                    <i class="fa-regular fa-comment-sms"></i>
                    <span id="smsBadgeCount" class="absolute -top-1 -right-1 bg-rose-500 text-white text-[9px] font-bold w-4 h-4 rounded-full flex items-center justify-center hidden">0</span>
                </button>
                <button id="logoutBtn" onclick="logoutUser()" class="hidden text-xs bg-slate-800 hover:bg-rose-900/40 text-slate-300 hover:text-rose-300 px-2.5 py-1.5 rounded-md transition font-medium border border-slate-700">
                    <i class="fa-solid fa-right-from-bracket mr-1"></i> Exit
                </button>
            </div>
        </header>

        <!-- Main App Viewport Body -->
        <main id="appBody" class="flex-1 overflow-y-auto relative bg-slate-950 p-4">
            <!-- Dynamic views injected via JavaScript -->
        </main>

        <!-- Bottom Navigation Footer -->
        <nav id="bottomNav" class="hidden bg-slate-900 border-t border-slate-800 px-4 py-2.5 flex justify-around items-center shrink-0 z-10">
        </nav>

        <!-- Global Toast / Modal Container -->
        <div id="modalContainer"></div>
        <div id="toastContainer" class="fixed bottom-16 left-4 right-4 z-50 pointer-events-none flex flex-col space-y-2 items-center"></div>
    </div>

    <script>
        // --- Central Application State ---
        const State = {
            currentUser: null, 
            currentView: 'login',
            supervisorAccount: {
                username: 'supervisor',
                password: 'ChangeMe123',
                mustChangePassword: true
            },
            faults: [
                {
                    id: 'F-1001',
                    reporterId: 'w1',
                    reporterName: 'John Doe (Routine Inspector)',
                    reporterRole: 'worker',
                    title: 'Main Breaker Panel Sparking',
                    location: 'Building A - Electrical Room B1',
                    description: 'Observed intermittent sparking and clicking sound from breaker 12 during routine check.',
                    priority: 'High',
                    status: 'Assigned', 
                    assignedToId: 'elec-1',
                    assignedToName: 'Mike Ross',
                    assignedPhone: '+1555019283',
                    createdAt: new Date(Date.now() - 3600000 * 3).toISOString(),
                    completedAt: '',
                    progress: 50,
                    materialsUsed: 'Copper wire 10AWG, arc shield',
                    beforePhoto: 'https://placehold.co/400x300/1e293b/f59e0b?text=Before:+Panel+Sparking',
                    afterPhoto: ''
                }
            ],
            electricians: [
                { id: 'elec-1', name: 'Mike Ross', username: 'mikeross', password: 'password123', phone: '+1555019283', email: 'mike.ross@dualufix.internal' },
                { id: 'elec-2', name: 'Elena Vance', username: 'elenavance', password: 'password123', phone: '+1555014829', email: 'elena.vance@dualufix.internal' },
                { id: 'elec-3', name: 'David Chen', username: 'davidchen', password: 'password123', phone: '+1555019944', email: 'david.chen@dualufix.internal' }
            ],
            smsInbox: [
                { id: 1, recipient: '+1555019283', message: 'Dualufix Alert: New work order (F-1001) assigned at Building A - Electrical Room B1.', time: '3 hrs ago' }
            ]
        };

        window.addEventListener('DOMContentLoaded', () => {
            const savedState = localStorage.getItem('dualufix_app_state_v2');
            if (savedState) {
                try {
                    const parsed = JSON.parse(savedState);
                    State.faults = parsed.faults || State.faults;
                    State.electricians = parsed.electricians || State.electricians;
                    State.supervisorAccount = parsed.supervisorAccount || State.supervisorAccount;
                    State.smsInbox = parsed.smsInbox || State.smsInbox;
                } catch(e) { console.error('Error loading saved state', e); }
            }
            render();
        });

        function saveStateToStorage() {
            localStorage.setItem('dualufix_app_state_v2', JSON.stringify({
                faults: State.faults,
                electricians: State.electricians,
                supervisorAccount: State.supervisorAccount,
                smsInbox: State.smsInbox
            }));
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            const bgClass = type === 'success' ? 'bg-emerald-600 text-white' : type === 'error' ? 'bg-rose-600 text-white' : 'bg-amber-600 text-slate-950 font-medium';
            toast.className = `${bgClass} px-4 py-2.5 rounded-lg shadow-lg text-xs font-semibold flex items-center space-x-2 pointer-events-auto fade-in max-w-xs text-center`;
            toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-triangle-exclamation'}"></i><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function render() {
            const body = document.getElementById('appBody');
            const nav = document.getElementById('bottomNav');
            const badge = document.getElementById('headerRoleBadge');
            const logoutBtn = document.getElementById('logoutBtn');
            const smsBadgeCount = document.getElementById('smsBadgeCount');

            if (State.smsInbox.length > 0) {
                smsBadgeCount.textContent = State.smsInbox.length;
                smsBadgeCount.classList.remove('hidden');
            } else {
                smsBadgeCount.classList.add('hidden');
            }

            if (!State.currentUser) {
                badge.textContent = 'Not Logged In';
                badge.className = 'text-[10px] uppercase font-semibold tracking-wider text-slate-400 bg-slate-800 px-1.5 py-0.5 rounded';
                logoutBtn.classList.add('hidden');
                nav.classList.add('hidden');
                body.innerHTML = renderLoginView();
                return;
            }

            logoutBtn.classList.remove('hidden');
            nav.classList.remove('hidden');

            if (State.currentUser.role === 'supervisor') {
                badge.textContent = 'Supervisor';
                badge.className = 'text-[10px] uppercase font-semibold tracking-wider text-amber-400 bg-amber-400/10 px-1.5 py-0.5 rounded';
                nav.innerHTML = renderSupervisorNav();
            } else if (State.currentUser.role === 'worker') {
                badge.textContent = 'Electrician';
                badge.className = 'text-[10px] uppercase font-semibold tracking-wider text-cyan-400 bg-cyan-400/10 px-1.5 py-0.5 rounded';
                nav.innerHTML = renderWorkerNav();
            } else if (State.currentUser.role === 'staff') {
                badge.textContent = 'Office Staff';
                badge.className = 'text-[10px] uppercase font-semibold tracking-wider text-emerald-400 bg-emerald-400/10 px-1.5 py-0.5 rounded';
                nav.innerHTML = renderStaffNav();
            }

            switch(State.currentView) {
                case 'supervisor_dash': body.innerHTML = renderSupervisorDashboard(); break;
                case 'supervisor_team': body.innerHTML = renderSupervisorTeamView(); break;
                case 'supervisor_history': body.innerHTML = renderSupervisorHistoryView(); break;
                case 'reports': body.innerHTML = renderReportsView(); break;
                case 'worker_dash': body.innerHTML = renderWorkerDashboard(); break;
                case 'staff_dash': body.innerHTML = renderStaffDashboard(); break;
                default: body.innerHTML = renderLoginView();
            }
        }

        function renderLoginView() {
            return `
                <div class="fade-in flex flex-col h-full justify-center py-6 px-2">
                    <div class="text-center mb-8">
                        <div class="w-16 h-16 bg-gradient-to-tr from-amber-500 to-amber-400 rounded-2xl mx-auto flex items-center justify-center text-slate-950 text-2xl shadow-lg shadow-amber-500/20 mb-3">
                            <i class="fa-solid fa-bolt"></i>
                        </div>
                        <h2 class="text-xl font-bold text-slate-100">Dualufix Portal</h2>
                        <p class="text-xs text-slate-400 mt-1">Electrical Maintenance & Work Order System</p>
                    </div>

                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-4">
                        <h3 class="text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Select Portal Login</h3>
                        
                        <button onclick="openSupervisorLoginModal()" class="w-full text-left p-3 rounded-xl bg-slate-800 hover:bg-slate-700/80 border border-slate-700 transition flex items-center justify-between group">
                            <div class="flex items-center space-x-3">
                                <div class="w-10 h-10 rounded-lg bg-amber-500/10 text-amber-400 flex items-center justify-center text-base">
                                    <i class="fa-solid fa-user-shield"></i>
                                </div>
                                <div>
                                    <div class="text-sm font-semibold text-slate-200">Supervisor Portal</div>
                                    <div class="text-[11px] text-slate-400">Secure sign-in & team management</div>
                                </div>
                            </div>
                            <i class="fa-solid fa-chevron-right text-xs text-slate-500"></i>
                        </button>

                        <button onclick="openWorkerLoginModal()" class="w-full text-left p-3 rounded-xl bg-slate-800 hover:bg-slate-700/80 border border-slate-700 transition flex items-center justify-between group">
                            <div class="flex items-center space-x-3">
                                <div class="w-10 h-10 rounded-lg bg-cyan-500/10 text-cyan-400 flex items-center justify-center text-base">
                                    <i class="fa-solid fa-hard-hat"></i>
                                </div>
                                <div>
                                    <div class="text-sm font-semibold text-slate-200">Electrician / Technician Login</div>
                                    <div class="text-[11px] text-slate-400">Unique user credentials sign-in</div>
                                </div>
                            </div>
                            <i class="fa-solid fa-chevron-right text-xs text-slate-500"></i>
                        </button>

                        <button onclick="loginAsStaff()" class="w-full text-left p-3 rounded-xl bg-slate-800 hover:bg-slate-700/80 border border-slate-700 transition flex items-center justify-between group">
                            <div class="flex items-center space-x-3">
                                <div class="w-10 h-10 rounded-lg bg-emerald-500/10 text-emerald-400 flex items-center justify-center text-base">
                                    <i class="fa-solid fa-building-user"></i>
                                </div>
                                <div>
                                    <div class="text-sm font-semibold text-slate-200">Office / Facility Staff</div>
                                    <div class="text-[11px] text-slate-400">Report electrical problems</div>
                                </div>
                            </div>
                            <i class="fa-solid fa-chevron-right text-xs text-slate-500"></i>
                        </button>
                    </div>
                </div>
            `;
        }

        function openSupervisorLoginModal() {
            const container = document.getElementById('modalContainer');
            container.innerHTML = `
                <div class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 fade-in">
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-sm p-5 space-y-4 shadow-2xl">
                        <div class="flex items-center justify-between">
                            <h3 class="text-sm font-bold text-slate-100">Supervisor Secure Login</h3>
                            <button onclick="closeModal()" class="text-slate-400 hover:text-slate-200"><i class="fa-solid fa-xmark text-base"></i></button>
                        </div>
                        <p class="text-xs text-slate-400">Default Username: <code class="text-amber-400">supervisor</code> | Default Password: <code class="text-amber-400">ChangeMe123</code></p>
                        
                        <div class="space-y-3">
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-400 mb-1">Username</label>
                                <input type="text" id="supUsername" placeholder="supervisor" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-amber-500">
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-400 mb-1">Password</label>
                                <input type="password" id="supPassword" placeholder="Password" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-amber-500">
                            </div>
                            <button onclick="verifySupervisorLogin()" class="w-full py-2.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs rounded-xl transition shadow">Sign In as Supervisor</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function verifySupervisorLogin() {
            const u = document.getElementById('supUsername').value.trim();
            const p = document.getElementById('supPassword').value;

            if (u !== State.supervisorAccount.username || p !== State.supervisorAccount.password) {
                showToast('Invalid supervisor credentials!', 'error');
                return;
            }

            closeModal();
            if (State.supervisorAccount.mustChangePassword) {
                openChangeSupervisorPasswordModal();
            } else {
                State.currentUser = { id: 'sup-1', name: 'Chief Supervisor', role: 'supervisor', email: 'supervisor@dualufix.internal', phone: '+1555019000' };
                State.currentView = 'supervisor_dash';
                showToast('Logged in as Supervisor');
                render();
            }
        }

        function openChangeSupervisorPasswordModal() {
            const container = document.getElementById('modalContainer');
            container.innerHTML = `
                <div class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 fade-in">
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-sm p-5 space-y-4 shadow-2xl">
                        <div class="flex items-center justify-between">
                            <h3 class="text-sm font-bold text-amber-400"><i class="fa-solid fa-triangle-exclamation mr-1"></i> First-Time Password Change</h3>
                        </div>
                        <p class="text-xs text-slate-400">For security compliance, you must change your default supervisor password before accessing the system.</p>
                        
                        <div class="space-y-3">
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-400 mb-1">New Secure Password</label>
                                <input type="password" id="newSupPass" placeholder="Enter new password" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-amber-500">
                            </div>
                            <button onclick="saveNewSupervisorPassword()" class="w-full py-2.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs rounded-xl transition shadow">Update Password & Continue</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function saveNewSupervisorPassword() {
            const val = document.getElementById('newSupPass').value;
            if (!val || val.length < 5) {
                showToast('Password must be at least 5 characters long', 'error');
                return;
            }
            State.supervisorAccount.password = val;
            State.supervisorAccount.mustChangePassword = false;
            saveStateToStorage();

            State.currentUser = { id: 'sup-1', name: 'Chief Supervisor', role: 'supervisor', email: 'supervisor@dualufix.internal', phone: '+1555019000' };
            State.currentView = 'supervisor_dash';
            closeModal();
            showToast('Password updated successfully!');
            render();
        }

        function openWorkerLoginModal() {
            const container = document.getElementById('modalContainer');
            container.innerHTML = `
                <div class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 fade-in">
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-sm p-5 space-y-4 shadow-2xl">
                        <div class="flex items-center justify-between">
                            <h3 class="text-sm font-bold text-slate-100">Technician Unique Login</h3>
                            <button onclick="closeModal()" class="text-slate-400 hover:text-slate-200"><i class="fa-solid fa-xmark text-base"></i></button>
                        </div>
                        <p class="text-xs text-slate-400">Enter your unique username and personal password.</p>
                        
                        <div class="space-y-3">
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-400 mb-1">Username</label>
                                <input type="text" id="workerLoginUsername" placeholder="e.g. mikeross" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-cyan-500">
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-400 mb-1">Password</label>
                                <input type="password" id="workerLoginPassword" placeholder="Password" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-cyan-500">
                            </div>
                            <button onclick="verifyWorkerLogin()" class="w-full py-2.5 bg-cyan-600 hover:bg-cyan-500 text-white font-bold text-xs rounded-xl transition shadow">Sign In to My Tasks</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function verifyWorkerLogin() {
            const username = document.getElementById('workerLoginUsername').value.trim().toLowerCase();
            const pass = document.getElementById('workerLoginPassword').value;

            const elec = State.electricians.find(e => e.username === username && e.password === pass);
            if (!elec) {
                showToast('Invalid technician username or password!', 'error');
                return;
            }

            State.currentUser = { id: elec.id, name: elec.name, role: 'worker', email: elec.email, phone: elec.phone };
            State.currentView = 'worker_dash';
            closeModal();
            showToast(`Welcome back, ${elec.name}!`);
            render();
        }

        function loginAsStaff() {
            State.currentUser = { id: 's1', name: 'Sarah Jenkins (Office Staff)', role: 'staff', email: 'sarah.jenkins@dualufix.internal', phone: '+1555019876' };
            State.currentView = 'staff_dash';
            showToast('Logged in as Office Staff');
            render();
        }

        function logoutUser() {
            State.currentUser = null;
            State.currentView = 'login';
            showToast('Logged out successfully', 'info');
            render();
        }

        function renderSupervisorNav() {
            return `
                <button onclick="switchView('supervisor_dash')" class="flex flex-col items-center py-1 px-2 ${State.currentView === 'supervisor_dash' ? 'text-amber-400' : 'text-slate-400 hover:text-slate-200'} transition">
                    <i class="fa-solid fa-clipboard-list text-sm mb-0.5"></i>
                    <span class="text-[9px] font-medium">Faults (${State.faults.length})</span>
                </button>
                <button onclick="switchView('supervisor_team')" class="flex flex-col items-center py-1 px-2 ${State.currentView === 'supervisor_team' ? 'text-amber-400' : 'text-slate-400 hover:text-slate-200'} transition">
                    <i class="fa-solid fa-users-gear text-sm mb-0.5"></i>
                    <span class="text-[9px] font-medium">Electricians</span>
                </button>
                <button onclick="switchView('supervisor_history')" class="flex flex-col items-center py-1 px-2 ${State.currentView === 'supervisor_history' ? 'text-amber-400' : 'text-slate-400 hover:text-slate-200'} transition">
                    <i class="fa-solid fa-calendar-days text-sm mb-0.5"></i>
                    <span class="text-[9px] font-medium">Job History</span>
                </button>
                <button onclick="switchView('reports')" class="flex flex-col items-center py-1 px-2 ${State.currentView === 'reports' ? 'text-amber-400' : 'text-slate-400 hover:text-slate-200'} transition">
                    <i class="fa-solid fa-file-pdf text-sm mb-0.5"></i>
                    <span class="text-[9px] font-medium">PDF & Email</span>
                </button>
            `;
        }

        function switchView(view) {
            State.currentView = view;
            render();
        }

        function renderSupervisorDashboard() {
            const pendingCount = State.faults.filter(f => f.status === 'Pending').length;
            const inProgressCount = State.faults.filter(f => f.status === 'In Progress' || f.status === 'Assigned').length;
            const completedCount = State.faults.filter(f => f.status === 'Completed').length;

            return `
                <div class="fade-in space-y-4 pb-16">
                    <div class="grid grid-cols-3 gap-2">
                        <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 text-center">
                            <span class="text-[10px] uppercase font-bold text-amber-400 tracking-wider">Pending</span>
                            <div class="text-xl font-extrabold text-slate-100 mt-0.5">${pendingCount}</div>
                        </div>
                        <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 text-center">
                            <span class="text-[10px] uppercase font-bold text-cyan-400 tracking-wider">Active</span>
                            <div class="text-xl font-extrabold text-slate-100 mt-0.5">${inProgressCount}</div>
                        </div>
                        <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 text-center">
                            <span class="text-[10px] uppercase font-bold text-emerald-400 tracking-wider">Completed</span>
                            <div class="text-xl font-extrabold text-slate-100 mt-0.5">${completedCount}</div>
                        </div>
                    </div>

                    <div class="flex items-center justify-between pt-1">
                        <h3 class="text-xs font-bold uppercase tracking-wider text-slate-300">Reported Faults & Work Orders</h3>
                        <span class="text-xs text-slate-400">Live Feed</span>
                    </div>

                    <div class="space-y-3">
                        ${State.faults.length === 0 ? `
                            <div class="text-center py-10 bg-slate-900/50 rounded-2xl border border-slate-800">
                                <i class="fa-solid fa-circle-check text-3xl text-slate-600 mb-2"></i>
                                <p class="text-xs text-slate-400">No active fault reports right now.</p>
                            </div>
                        ` : State.faults.map(f => {
                            let statusColor = 'bg-amber-500/10 text-amber-400 border-amber-500/20';
                            if (f.status === 'Completed') statusColor = 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20';
                            if (f.status === 'In Progress') statusColor = 'bg-cyan-500/10 text-cyan-400 border-cyan-500/20';
                            
                            return `
                                <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-md space-y-3">
                                    <div class="flex items-start justify-between">
                                        <div>
                                            <span class="text-[10px] font-mono text-slate-400">${f.id} •${new Date(f.createdAt).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>

        function downloadHistoryPDF(dateStr) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const matching = State.faults.filter(f => (f.completedAt || f.createdAt).split('T')[0] === dateStr);

            doc.setFillColor(15, 23, 42);
            doc.rect(0, 0, 210, 297, 'F');

            doc.setTextColor(245, 158, 11);
            doc.setFontSize(22);
            doc.text(`Dualufix Job Audit Report (${dateStr})`, 20, 25);

            doc.setTextColor(148, 163, 184);
            doc.setFontSize(10);
            doc.text(`Generated on: ${new Date().toLocaleString()} | Total Records: ${matching.length}`, 20, 33);

            let y = 50;
            matching.forEach((f, idx) => {
                if (y > 260) {
                    doc.addPage();
                    doc.setFillColor(15, 23, 42);
                    doc.rect(0, 0, 210, 297, 'F');
                    y = 25;
                }

                doc.setTextColor(255, 255, 255);
                doc.setFontSize(12);
                doc.text(`${idx + 1}. [${f.id}] ${f.title}`, 20, y);

                doc.setFontSize(9);
                doc.setTextColor(148, 163, 184);
                doc.text(`Location: ${f.location} | Status: ${f.status} (${f.progress}%)`, 20, y + 6);
                doc.text(`Electrician: ${f.assignedToName || 'Unassigned'} | Materials: ${f.materialsUsed || 'None'}`, 20, y + 12);
                doc.text(`Description: ${f.description}`, 20, y + 18);

                y += 28;
            });

            doc.save(`Dualufix_Job_History_${dateStr}.pdf`);
            showToast('Date history PDF downloaded successfully!');
        }

        function openAssignModal(faultId) {
            const fault = State.faults.find(f => f.id === faultId);
            const container = document.getElementById('modalContainer');
            container.innerHTML = `
                <div class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 fade-in">
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-sm p-5 space-y-4 shadow-2xl">
                        <div class="flex items-center justify-between">
                            <h3 class="text-sm font-bold text-slate-100">Assign Task: ${fault.id}</h3>
                            <button onclick="closeModal()" class="text-slate-400 hover:text-slate-200"><i class="fa-solid fa-xmark text-base"></i></button>
                        </div>
                        <p class="text-xs text-slate-400">Select electrician to dispatch for <strong>${fault.title}</strong> at <strong>${fault.location}</strong>.</p>
                        
                        <div class="space-y-2 max-h-48 overflow-y-auto">
                            ${State.electricians.map(e => `
                                <button onclick="assignFaultToElectrician('${fault.id}', '${e.id}')" class="w-full text-left p-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 transition flex items-center justify-between">

                                        <div class="text-xs font-semibold text-slate-200">${e.name} (@${e.username})</div>
                                        <div class="text-[10px] text-slate-400">${e.phone}</div>
                                    </div>
                                    <span class="text-[10px] bg-amber-500/10 text-amber-400 px-2 py-1 rounded font-bold">Assign & SMS</span>
                                </button>
                            `).join('')}
                        </div>

                        <button onclick="closeModal()" class="w-full py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold text-xs rounded-xl transition">Cancel</button>
                    </div>
                </div>
            `;
        }

        function assignFaultToElectrician(faultId, elecId) {
            const fault = State.faults.find(f => f.id === faultId);
            const elec = State.electricians.find(e => e.id === elecId);
            if (!fault || !elec) return;

            fault.assignedToId = elec.id;
            fault.assignedToName = elec.name;
            fault.assignedPhone = elec.phone;
            fault.status = 'Assigned';

            const smsText = `Dualufix Alert: New work order (${fault.id}) assigned at ${fault.location}. Priority: ${fault.priority}. Login to view details.`;
            State.smsInbox.unshift({
                id: Date.now(),
                recipient: elec.phone,
                message: smsText,
                time: 'Just now'
            });

            saveStateToStorage();
            closeModal();
            showToast(`Assigned to ${elec.name}! Opening SMS Gateway...`);
            render();

            setTimeout(() => {
                window.location.href = `sms:${elec.phone}?body=${encodeURIComponent(smsText)}`;
            }, 600);
        }

        function openSmsSimulatorModal() {
            const container = document.getElementById('modalContainer');
            container.innerHTML = `
                <div class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 fade-in">

                                    <i class="fa-solid fa-comment-sms"></i>
                                </div>
                                <h3 class="text-sm font-bold text-slate-100">SMS Outbox Log</h3>
                            </div>
                            <button onclick="closeModal()" class="text-slate-400 hover:text-slate-200"><i class="fa-solid fa-xmark text-base"></i></button>
                        </div>
                        <p class="text-[11px] text-slate-400">All text dispatch logs sent to technicians:</p>

                        <div class="space-y-2 max-h-60 overflow-y-auto">
                            ${State.smsInbox.length === 0 ? `<p class="text-xs text-slate-500 text-center py-4">No SMS alerts sent yet.</p>` : State.smsInbox.map(sms => `
                                <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 space-y-1">
                                    <div class="flex justify-between text-[10px] text-slate-400">
                                        <span>To: <strong class="text-amber-400">${sms.recipient}</strong></span>

                    </div>
                </div>
            `;
        }

        function openAddElectricianModal() {
            const container = document.getElementById('modalContainer');
            container.innerHTML = `
                <div class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 fade-in">
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-sm p-5 space-y-4 shadow-2xl">
                        <div class="flex items-center justify-between">
                            <h3 class="text-sm font-bold text-slate-100">Create Electrician Login</h3>
                            <button onclick="closeModal()" class="text-slate-400 hover:text-slate-200"><i class="fa-solid fa-xmark text-base"></i></button>
                        </div>
                        <form onsubmit="handleAddElectricianSubmit(event)" class="space-y-3">

                                <input type="text" id="newElecName" required placeholder="Alex Mercer" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-amber-500">
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-400 mb-1">Unique Username</label>
                                <input type="text" id="newElecUser" required placeholder="alexmercer" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-amber-500">
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-400 mb-1">Personal Password</label>
                                <input type="password" id="newElecPass" required placeholder="Password for login" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-amber-500">
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-400 mb-1">Phone Number (for SMS)</label>
                                <input type="tel" id="newElecPhone" required placeholder="+1555018899" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-amber-500">
                            </div>
                            <button type="submit" class="w-full py-2.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs rounded-xl transition shadow">Create Electrician Account</button>
                        </form>
                    </div>
                </div>
            `;
        }

        function handleAddElectricianSubmit(e) {
            e.preventDefault();
            const name = document.getElementById('newElecName').value.trim();
            const username = document.getElementById('newElecUser').value.trim().toLowerCase();
            const password = document.getElementById('newElecPass').value;
            const phone = document.getElementById('newElecPhone').value.trim();

            State.electricians.push({
                id: 'elec-' + Date.now(),
                name,
                username,
                password,
                phone,
                email: `${username}@dualufix.internal`
            });

            saveStateToStorage();
            closeModal();
            showToast(`Created login for ${name}`);
            render();
        }

        function removeElectrician(id) {
            State.electricians = State.electricians.filter(e => e.id !== id);
            saveStateToStorage();
            showToast('Electrician removed', 'info');
            render();
        }

        function openRoutineCheckModal() {
            const container = document.getElementById('modalContainer');
            container.innerHTML = `
                <div class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 fade-in">
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-sm p-5 space-y-4 shadow-2xl">
                        <div class="flex items-center justify-between">
                            <h3 class="text-sm font-bold text-slate-100">Log Routine Inspection Fault</h3>
                            <button onclick="closeModal()" class="text-slate-400 hover:text-slate-200"><i class="fa-solid fa-xmark text-base"></i></button>
                        </div>
                        <form onsubmit="handleRoutineFaultSubmit(event)" class="space-y-3">
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-400 mb-1">Fault Title</label>
                                <input type="text" id="routineTitle" required placeholder="e.g. Worn wiring insulation" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-cyan-500">
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-400 mb-1">Location / Zone</label>
                                <input type="text" id="routineLocation" required placeholder="e.g. Substation B - Panel 4" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-cyan-500">
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-400 mb-1">Description & Findings</label>
                                <textarea id="routineDesc" rows="3" required placeholder="Describe the fault found..." class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-cyan-500 resize-none"></textarea>
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-400 mb-1">Priority</label>
                                <select id="routinePriority" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-cyan-500">
                                    <option value="Normal">Normal</option>
                                    <option value="High">High</option>
                                    <option value="Urgent">Urgent</option>
                                </select>
                            </div>
                            <button type="submit" class="w-full py-2.5 bg-cyan-600 hover:bg-cyan-500 text-white font-bold text-xs rounded-xl transition shadow">Submit Fault to Supervisor</button>
                        </form>
                    </div>
                </div>
            `;
        }

        function handleRoutineFaultSubmit(e) {
            e.preventDefault();
            const title = document.getElementById('routineTitle').value;
            const location = document.getElementById('routineLocation').value;
            const description = document.getElementById('routineDesc').value;
            const priority = document.getElementById('routinePriority').value;

            const newFault = {
                id: 'F-' + Math.floor(1000 + Math.random() * 9000),
                reporterId: State.currentUser.id,
                reporterName: State.currentUser.name,
                reporterRole: State.currentUser.role,
                title, location, description, priority,
                status: 'Pending',
                assignedToId: '', assignedToName: '', assignedPhone: '',
                createdAt: new Date().toISOString(),
                completedAt: '',
                progress: 0,
                materialsUsed: '',
                beforePhoto: 'https://placehold.co/400x300/1e293b/06b6d4?text=Before:+Routine+Inspection',
                afterPhoto: ''
            };

            State.faults.unshift(newFault);
            saveStateToStorage();
            closeModal();
            showToast('Fault logged successfully! Supervisor notified.');
            render();
        }

        function handleStaffReportSubmit(e) {
            e.preventDefault();
            const title = document.getElementById('staffIssueTitle').value;
            const location = document.getElementById('staffIssueLocation').value;
            const description = document.getElementById('staffIssueDesc').value;
            const priority = document.getElementById('staffIssuePriority').value;

            const newFault = {
                id: 'F-' + Math.floor(1000 + Math.random() * 9000),
                reporterId: State.currentUser.id,
                reporterName: State.currentUser.name,
                reporterRole: State.currentUser.role,
                title, location, description, priority,
                status: 'Pending',
                assignedToId: '', assignedToName: '', assignedPhone: '',
                createdAt: new Date().toISOString(),
                completedAt: '',
                progress: 0,
                materialsUsed: '',
                beforePhoto: 'https://placehold.co/400x300/1e293b/10b981?text=Before:+Office+Issue',
                afterPhoto: ''
            };

            State.faults.unshift(newFault);
            saveStateToStorage();
            showToast('Electrical issue submitted to supervisor!');
            render();
        }

        function openPhotoUploadModal(faultId, type) {
            const container = document.getElementById('modalContainer');
            const samplePhotos = type === 'before' ? [
                'https://placehold.co/400x300/1e293b/f59e0b?text=Inspection+Photo+1',
                'https://placehold.co/400x300/1e293b/ef4444?text=Fault+Closeup',
                'https://placehold.co/400x300/1e293b/3b82f6?text=Breaker+Panel'
            ] : [
                'https://placehold.co/400x300/1e293b/10b981?text=Fixed+Wiring+After',
                'https://placehold.co/400x300/1e293b/06b6d4?text=Restored+Power+After',
                'https://placehold.co/400x300/1e293b/8b5cf6?text=Clean+Panel+After'
            ];

            container.innerHTML = `
                <div class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 fade-in">
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-sm p-5 space-y-4 shadow-2xl">
                        <div class="flex items-center justify-between">
                            <h3 class="text-sm font-bold text-slate-100">Attach ${type.toUpperCase()} Photo</h3>
                            <button onclick="closeModal()" class="text-slate-400 hover:text-slate-200"><i class="fa-solid fa-xmark text-base"></i></button>
                        </div>
                        <p class="text-[11px] text-slate-400">Select photo for work order ${faultId}:</p>
                        
                        <div class="grid grid-cols-3 gap-2">
                            ${samplePhotos.map(url => `
                                <button onclick="selectPhotoForTask('${faultId}', '${type}', '${url}')" class="rounded-lg overflow-hidden border border-slate-700 hover:border-amber-400 transition group">
                                    <img src="${url}" class="w-full h-20 object-cover group-hover:scale-105 transition">
                                </button>
                            `).join('')}
                        </div>

                        <button onclick="closeModal()" class="w-full py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold text-xs rounded-xl transition">Cancel</button>
                    </div>
                </div>
            `;
        }

        function selectPhotoForTask(faultId, type, url) {
            const fault = State.faults.find(f => f.id === faultId);
            if (!fault) return;

            if (type === 'before') fault.beforePhoto = url;
            else {
                fault.afterPhoto = url;
                fault.progress = 100;
                fault.status = 'Completed';
                fault.completedAt = new Date().toISOString();
            }

            saveStateToStorage();
            closeModal();
            showToast(`${type.toUpperCase()} photo attached successfully!`);
            render();
        }

        function updateTaskProgress(faultId, val) {
            const fault = State.faults.find(f => f.id === faultId);
            if (!fault) return;

            fault.progress = parseInt(val);
            if (fault.progress === 100) {
                fault.status = 'Completed';
                fault.completedAt = new Date().toISOString();
            } else if (fault.progress > 0) {
                fault.status = 'In Progress';
            }

            saveStateToStorage();
            render();
        }

        function updateTaskMaterials(faultId, val) {
            const fault = State.faults.find(f => f.id === faultId);
            if (!fault) return;
            fault.materialsUsed = val;
            saveStateToStorage();
        }

        function completeTaskQuick(faultId) {
            const fault = State.faults.find(f => f.id === faultId);
            if (!fault) return;

            fault.progress = 100;
            fault.status = 'Completed';
            fault.completedAt = new Date().toISOString();
            if (!fault.afterPhoto) {
                fault.afterPhoto = 'https://placehold.co/400x300/1e293b/10b981?text=Job+Completed+Successfully';
            }

            saveStateToStorage();
            showToast('Work order marked 100% complete and removed from your active screen!');
            render();
        }

        function closeModal() {
            document.getElementById('modalContainer').innerHTML = '';
        }

        function generateAndDownloadPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            doc.setFillColor(15, 23, 42);
            doc.rect(0, 0, 210, 297, 'F');

            doc.setTextColor(245, 158, 11);
            doc.setFontSize(22);
            doc.text("Dualufix Daily Maintenance Report", 20, 25);

            doc.setTextColor(148, 163, 184);
            doc.setFontSize(10);
            doc.text(`Generated on: ${new Date().toLocaleString()}`, 20, 33);
            doc.text(`Total Faults & Work Orders Logged: ${State.faults.length}`, 20, 40);

            let y = 55;
            State.faults.forEach((f, idx) => {
                if (y > 260) {
                    doc.addPage();
                    doc.setFillColor(15, 23, 42);
                    doc.rect(0, 0, 210, 297, 'F');
                    y = 25;
                }

                doc.setTextColor(255, 255, 255);
                doc.setFontSize(12);
                doc.text(`${idx + 1}. [${f.id}] ${f.title}`, 20, y);

                doc.setFontSize(9);
                doc.setTextColor(148, 163, 184);
                doc.text(`Location: ${f.location} | Status: ${f.status} | Progress: ${f.progress}%`, 20, y + 6);
                doc.text(`Assigned To: ${f.assignedToName || 'Unassigned'} | Materials: ${f.materialsUsed || 'None'}`, 20, y + 12);
                doc.text(`Description: ${f.description}`, 20, y + 18);

                y += 28;
            });

            doc.save(`Dualufix_Maintenance_Report_${new Date().toISOString().split('T')[0]}.pdf`);
            showToast('PDF Report downloaded to phone!');
        }

        function sendReportByEmail() {
            const emailInput = document.getElementById('reportEmailInput');
            const email = emailInput ? emailInput.value : '';
            if (!email) {
                showToast('Please enter a valid email address', 'error');
                return;
            }
            showToast(`Daily summary PDF successfully dispatched to ${email}!`);
        }
    </script>
